name: Verify SmartSpend
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:api
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewport-evidence
          path: test-results/
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: smartspend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: smartspend_test
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap isolated auth fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - name: Apply schema in migration order
        run: |
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify ownership, child privacy, invite replay and authorization
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/permissions.sql
      - name: Verify identity uniqueness and display-name privacy
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/identity.sql
      - name: Verify combined phone setup on a second empty database
        run: |
          createdb smartspend_setup_test
          sed '/^create role /d' supabase/tests/bootstrap.sql | PGDATABASE=smartspend_setup_test psql -v ON_ERROR_STOP=1
          PGDATABASE=smartspend_setup_test psql -v ON_ERROR_STOP=1 -f supabase/setup.sql
          PGDATABASE=smartspend_setup_test psql -v ON_ERROR_STOP=1 -f supabase/tests/permissions.sql
          PGDATABASE=smartspend_setup_test psql -v ON_ERROR_STOP=1 -f supabase/tests/identity.sql
